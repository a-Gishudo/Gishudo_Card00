<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT ME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <header class="card-header">
            ABOUT ME
        </header>

        <div class="card-body">
            <!-- 上部セクション（左1枠：基本情報＋技ちゃん / 右2枠：メッセージ） -->
            <div class="top-section">
                <!-- 左：基本情報と技ちゃん -->
                <div class="grid-item info-item">
                    <div class="info-text-stack">
                        <div class="info-row">
                            <span class="label">名前</span><span class="colon">：</span>
                            <span class="value">川原 亜子</span>
                        </div>
                        <div class="info-row">
                            <span class="label">出身地</span><span class="colon">：</span>
                            <span class="value">神奈川県</span>
                        </div>
                        <div class="info-row">
                            <span class="label">血液型</span><span class="colon">：</span>
                            <span class="value">A型</span>
                        </div>
                    </div>
                    <!-- 技ちゃんを左側の下のスペースへ移動 -->
                    <div class="character-image">
                        <img src="Gichan.gif" alt="技ちゃん">
                    </div>
                </div>

                <!-- 右：メッセージ枠 -->
                <div class="grid-item message-item">
                    <div class="item-title">メッセージ</div>
                    <div class="message-inner">
                        <div class="item-content">本日は技秀堂へ体験に来ていただき、ありがとうございます。今日みなさんが作った名刺とともに、将来『こんなことやったな！』とふと思い出してもらえるような、楽しい体験になってくれれば嬉しいです。</div>
                    </div>
                </div>
            </div>

            <!-- 中段グリッドセクション（3分割） -->
            <div class="profile-grid">
                <div class="grid-item">
                    <div class="item-title">性格</div>
                    <div class="item-content">普段は温厚でマイペース</div>
                </div>
                <div class="grid-item">
                    <div class="item-title">座右の銘</div>
                    <div class="item-content">謙虚</div>
                </div>
                <div class="grid-item">
                    <div class="item-title">マイブーム</div>
                    <div class="item-content">ゆで卵と松尾汐恩</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
