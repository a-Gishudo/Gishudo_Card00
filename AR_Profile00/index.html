<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABOUT ME</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">
        <header class="card-header">
            ABOUT ME
        </header>

        <div class="card-body">
            <!-- 上部セクション（左1枠：基本情報 / 右2枠：メッセージ＋技ちゃん） -->
            <div class="top-section">
                <!-- 左：基本情報（枠なし） -->
                <div class="grid-item info-item">
                    <div class="info-text-stack">
                        <div class="info-row">
                            <span class="label">名前</span><span class="colon">：</span>
                            <span class="value">技秀堂 太郎</span>
                        </div>
                        <div class="info-row">
                            <span class="label">出身地</span><span class="colon">：</span>
                            <span class="value">東京都</span>
                        </div>
                        <div class="info-row">
                            <span class="label">血液型</span><span class="colon">：</span>
                            <span class="value">A型</span>
                        </div>
                    </div>
                </div>

                <!-- 右：メッセージ枠 -->
                <div class="grid-item message-item">
                    <div class="item-title">メッセージ</div>
                    <div class="message-inner">
                        <div class="item-content">お気軽になんでもご相談ください！</div>
                        <div class="character-image">
                            <img src="Gichan.gif" alt="技ちゃん"> 
                        </div>
                    </div>
                </div>
            </div>

            <!-- 中段グリッドセクション（3分割） -->
            <div class="profile-grid">
                <div class="grid-item">
                    <div class="item-title">性格</div>
                    <div class="item-content">真面目</div>
                </div>
                <div class="grid-item">
                    <div class="item-title">座右の銘</div>
                    <div class="item-content">初志貫徹</div>
                </div>
                <div class="grid-item">
                    <div class="item-title">マイブーム</div>
                    <div class="item-content">DIY</div>
                </div>
            </div>

            <!-- 最下部セクション（3枠分幅：技秀堂の推しポイント） -->
            <div class="grid-item full-width-item">
                <div class="item-title">技秀堂の推しポイント</div>
                <div class="item-content">お客様の想いが的確に伝わる物や手段を作り、お客様の事業に加工技術で貢献するという理念</div>
            </div>
        </div>
    </div>
</body>
</html>
